# CheerpX's documented ext2 revision-0 format. Do not inherit the host's
# ext4 features or default ACL/xattr mount options.
[defaults]
    base_features = ""
    default_mntopts = ""
    blocksize = 4096
    inode_size = 128
    inode_ratio = 16384

[fs_types]
    ext2 = {
        features = ""
    }
    small = {
        features = ""
    }
