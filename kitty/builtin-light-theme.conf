# The built-in light theme
#
# Used when the system color scheme is light, there is no
# light-theme.auto.conf in the config directory and silkie.conf does not set
# any colors (see the automatic_light_theme option). To customize it, copy
# this file to light-theme.auto.conf in the Silkie config directory and edit it
# there. Colors not set here keep their default values.
#
# A warm off-white background and dark slate text, rather than pure black on
# pure white, to reduce glare. Contrast ratios are WCAG 2 ratios against the
# background (4.5:1 is the AA level for body text, 7:1 AAA). Every one of the
# 16 ANSI colors meets AA as text on the background, including "white" (7)
# and "bright white" (15), which are mid grays here so that text programs
# print in them stays readable. The bright colors are as dark as AA requires
# and are told apart from the normal ones by hue and saturation rather than by
# being lighter.

# 12.23:1
foreground #2b2f36
background #f6f4ef

# The cursor is the text color with the text under it in the background color
cursor #2b2f36
cursor_text_color #f6f4ef

# Selected text: 8.59:1 against the selection background
selection_foreground #2b2f36
selection_background #b9d1ee

# 5.54:1
url_color #1f5fbf

# Window borders: active 5.05:1, inactive 2.61:1 (deliberately quiet), bell 4.71:1
active_border_color #26773a
inactive_border_color #9d988d
bell_border_color #c2410c

# Tab bar: active tab text 12.23:1, inactive tab text 5.91:1 on its tab
active_tab_foreground #f6f4ef
active_tab_background #2b2f36
inactive_tab_foreground #4a4f57
inactive_tab_background #dedad2
tab_bar_background #e9e6df

# black: 12.23:1, 7.74:1
color0 #2b2f36
color8 #474d57

